# Multi-service compose file.
# Backend: FastAPI application + DB migrations (dbmate).
# Frontend: placeholder — uncomment and fill in once implemented.
#
# Usage:
#   docker compose up              # start everything (migrate, backend, frontend)
#   docker compose up backend      # start backend only
#   docker compose up frontend     # start frontend only (requires backend running)

services:
  # ── Database migrations ──────────────────────────────────────────────────────
  migrate:
    image: ghcr.io/amacneil/dbmate:latest
    container_name: ragfier-migrate
    env_file:
      - backend/.env
    environment:
      DBMATE_MIGRATIONS_DIR: /db/sql/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./backend:/db
    entrypoint: ["/bin/sh", "/db/scripts/run-dbmate-container.sh"]
    restart: "no"

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragfier-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/eval:/app/eval
      - ./backend/config:/app/config
      - ./backend/prompts:/app/prompts
      - ./backend/sql:/app/sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── Frontend (Next.js 15 dashboard) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* env vars are baked into the client bundle at build time.
      # Override via `docker compose build --build-arg NEXT_PUBLIC_API_URL=...`
      # when deploying behind a public gateway.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ragfier-frontend
    ports:
      - "3000:3000"
    environment:
      # Consumed by SSR/route handlers. The browser bundle uses the build-arg
      # value above, which must point at a host the browser can reach.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
