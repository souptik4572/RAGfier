name: RAG Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/pipeline/**'
      - 'app/api/query*.py'
      - 'prompts/**'
      - 'sql/**'
      - 'eval/**'
      - 'tests/test_rag_evaluation.py'
      - 'requirements.txt'

  workflow_dispatch:
    inputs:
      dataset_version:
        description: 'Golden dataset version stem (e.g., golden_v1.0.0)'
        required: false
        default: 'golden_v1.0.0'

  schedule:
    - cron: '0 6 * * 1'  # Weekly drift detection — Mondays 06:00 UTC

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit-level custom metric tests
        run: |
          pytest tests/test_custom_metrics.py tests/test_eval_runner.py tests/test_eval_api.py -q

      - name: Run RAG evaluation suite (DeepEval)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LLAMA_CLOUD_API_KEY: ${{ secrets.LLAMA_CLOUD_API_KEY }}
          EVAL_DATASET_PATH: eval/datasets/${{ github.event.inputs.dataset_version || 'golden_v1.0.0' }}.json
          EVAL_TENANT_ID: ${{ secrets.EVAL_TENANT_ID }}
          RAGAS_DO_NOT_TRACK: 'true'
        run: |
          deepeval test run tests/test_rag_evaluation.py --verbose || echo "deepeval_exit=$?" >> $GITHUB_ENV

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: eval/reports/
          if-no-files-found: ignore

      - name: Persist evaluation results
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -m eval.scripts.store_results \
            --git-sha ${{ github.sha }} \
            --git-branch ${{ github.head_ref || github.ref_name }} \
            --trigger ci || true

      - name: Fail job if evaluation failed
        if: env.deepeval_exit != '' && env.deepeval_exit != '0'
        run: |
          echo "DeepEval quality gate failed (exit=${{ env.deepeval_exit }})"
          exit 1
