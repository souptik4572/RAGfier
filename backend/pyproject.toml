[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfier"
version = "0.1.0"
description = "Multi-tenant RAG ingestion pipeline (Phase 1)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "cohere>=5.0.0",
    "cryptography>=42.0.0",
    "datasets>=2.14.0",
    "deepeval>=1.0.0",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-text-splitters>=0.0.1",
    "llama-parse>=0.4.0",
    "nest-asyncio>=1.5.0",
    "openai>=1.12.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "ragas>=0.4.0",
    "sse-starlette>=1.6.0",
    "supabase>=2.0.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.5.0",
    "uvicorn[standard]>=0.24.0",
]

[project.scripts]
ragfier-purge-bucket = "app.cli.purge_supabase_bucket:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
include = ["app*"]
